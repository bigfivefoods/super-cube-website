name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npx tsc --noEmit -p .
      - run: npm run test:unit
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    name: Playwright (journey, access, checkout, a11y, security)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Placeholder Supabase project (unreachable, no secrets): turns the
      # sign-in gate on so access rules are tested; nothing is ever stored.
      NEXT_PUBLIC_SUPABASE_URL: "https://ci-placeholder.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-placeholder-anon-key"
      EXPECT_AUTH_GATE: "1"
      CSP_MODE: "enforce"
      BASE_URL: "http://127.0.0.1:3000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start the app
        run: |
          npm run start -- -p 3000 > /tmp/app.log 2>&1 &
          npx --yes wait-on@8 -t 60000 http://127.0.0.1:3000/
      - name: Playwright
        # Specs that need the Supabase stack (LMS_STACK=1) skip themselves.
        run: npx playwright test --workers=2
      - if: failure()
        run: tail -200 /tmp/app.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results
          retention-days: 7
